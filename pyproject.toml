[build-system]
requires = ["setuptools>=64", "pybind11>=2.13", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhccl"
version = "0.1.0"
description = "Python bindings for the Ascend HCCL / HCOMM collective communication libraries"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
authors = [{ name = "CANN HCCL Team" }]
keywords = [
    "hccl",
    "hcomm",
    "npu",
    "ascend",
    "collective",
    "communication",
    "allreduce",
    "distributed",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["pyhccl"]

[tool.setuptools.package-data]
pyhccl = ["py.typed"]

[tool.cibuildwheel]
# 在 CI（无真机 CANN 环境）中构建通用 wheel；本地真机上可重新构建以链接实际 .so
test-requires = "pytest"
test-command = "pytest {project}/tests"

[tool.ruff]
# Python 快速静态检查 + 格式化（CI 中用 `ruff check` 与 `ruff format --check` 校验）
line-length = 120
target-version = "py39"
src = ["src", "tests"]
extend-exclude = ["build", "dist", "*.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
# 绑定包通过 `globals()` 动态导出 _C 符号，属于有意为之的元编程，无需告警。
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["pyhccl"]
