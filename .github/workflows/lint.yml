name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install lint tools (pinned versions)
        run: pip install --upgrade pip clang-format==21.1.0 ruff==0.17.1 pylint==4.1.3

      - name: Check C++ formatting
        run: clang-format --version && clang-format --dry-run --Werror src/csrc/*.hpp src/csrc/*.cpp

      - name: Build extension in editable mode
        # pylint 需要能 import pyhccl（含编译扩展 pyhccl._C），故此处先构建安装
        run: pip install -e .

      - name: Ruff check
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Pylint
        run: pylint src/pyhccl tests
